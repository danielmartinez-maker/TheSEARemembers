name: Full manuscript QA and chapter memory evidence

on:
  push:
    branches:
      - "audit/four-phase-continuity-2026-10-13"
  pull_request:
    paths:
      - "chapters/**"
      - "bonus/**"
      - "continuity/**"
      - "scripts/**"
      - "FIC_CONTEXT.md"
      - ".github/workflows/full-manuscript-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manuscript-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile QA scripts
        run: python -m py_compile scripts/full_manuscript_qa.py scripts/build_memory_evidence_index.py scripts/check_character_memory.py scripts/audit_chapter_structure.py scripts/audit_duplicate_windows.py
      - name: Recount and check every 300-word window
        run: |
          python scripts/full_manuscript_qa.py \
            --json editorial/audits/generated-full-qa.json \
            --markdown editorial/audits/generated-full-qa.md \
            --strict-duplicates
      - name: Check chapter index, numbering, headings and UTF-8
        run: python scripts/audit_chapter_structure.py --json editorial/audits/generated-chapter-structure.json
      - name: Check 300-word windows across chapters and bonus interludes
        run: python scripts/audit_duplicate_windows.py --chapters chapters --bonus bonus --words 300 --json editorial/audits/generated-all-text-300-word-qa.json --strict-duplicates
      - name: Build provisional chapter source locator index
        run: |
          python scripts/build_memory_evidence_index.py \
            --json continuity/evidence/generated-ch001-current.json \
            --markdown continuity/evidence/generated-ch001-current.md
      - name: Enforce anchored relationship memory regressions
        run: python scripts/check_character_memory.py
      - name: Upload evidence and mechanical audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-qa-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            editorial/audits/generated-full-qa.json
            editorial/audits/generated-full-qa.md
            editorial/audits/generated-chapter-structure.json
            editorial/audits/generated-all-text-300-word-qa.json
            continuity/evidence/generated-ch001-current.json
            continuity/evidence/generated-ch001-current.md
