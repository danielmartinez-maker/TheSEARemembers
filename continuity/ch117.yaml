directly_witnessed:
  - "Percy and Annabeth choose separate activities for the day and agree to meet at dinner. Percy goes to Tempest Hall with Clarisse and Silena; Annabeth completes the east-porch study with Thalia. No hourly check-ins or hidden test are planned."
  - "At Tempest Hall, Percy, Clarisse, and Silena conduct staged gate/baffle testing. They first test without swimmers, then use floats and a one-person-at-a-time run. A float crosses the stop boundary; Silena calls stop, Percy reduces the flow, and Clarisse waits until the gate is settled before retrieval. They add separate caution and closed markers, a clear exit route, a hand rope along the coping, and a sequence requiring a locked gate before anyone retrieves a float."
  - "The fast lane remains closed pending Chiron's inspection, sealed signs, and a wet retest of the rewrapped practice grip. Clarisse, Percy, and Silena log tide direction and settings, brace the hinge, reset the baffles to neutral, and leave the Hall clean. At the lowest step, the post obscures Percy's raised-arm cue from the original watcher position; Silena moves one tile toward the ladder and the signal passes clearly on retest. The day's test is not recorded as Chiron's final safety approval."
  - "Clarisse is spun by the current on an early spear pass, then adjusts and completes a controlled pass. Percy gets a scrape to his elbow; Silena applies salve. Clarisse has a blister; Percy cleans and wraps it. Wet spear grip remains a design/safety issue."
  - "Annabeth and Thalia remeasure the east porch and confirm the existing plan's landing width is three inches greater than the actual landing. A bucket test shows water escaping at the gutter joint and spreading behind the step. Annabeth sketches a separate shallow channel around the stair footing toward an outlet between the roses. No digging, gutter repair, or construction occurs. Chiron and Katie must approve the joint repair/outlet and the ground near the roots."
  - "Annabeth and Thalia test the door swing, a shallow wall-side bench, and the passage to the stairs with a basket and a person occupying the seat. Annabeth selects a narrow landing with a shallow bench along the wall, keeping the main walking route open and the rose bed undisturbed pending foundation/root checks. She prepares two stair options and a review list for Chiron; the chosen design is a recommendation, not authorization to build."
  - "Percy, Clarisse, and Silena mutually shift the Cabin Three quiet hour for the day to after the Tempest Hall test and before dinner. Percy hangs the blue cloth and records the gate notes; Clarisse sharpens on the porch; Silena rewraps and dry-checks the practice grip, which remains pending a wet retest with Chiron. They share the hour without loud work. The agreement returns to the regular board time the next day."
  - "At dinner, Percy and Annabeth calmly exchange the porch and rig results. They remain established romantic partners; a later brief walk includes a kiss and a possible, unbooked plan to spend time together the following day."
