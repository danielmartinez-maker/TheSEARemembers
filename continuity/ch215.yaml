people_knowledge_relationships:
  ianthe:
    - "Receives one meaningful but bounded task from Beckendorf: record flags and cover movement at the drying rack, report changes, and leave handling and staffing decisions to Beckendorf."
    - "Records two damp rope coils, a drying-rack cover, and the separate untested loop without claiming the materials are ready."
    - "Makes one consequential command slip: after misreading a shadow as a coil shift, she orders Leandros to move the coil and Clarisse to hold the tie. Both refuse; Beckendorf checks and confirms no coil moved. Their fence measurement must be repeated."
    - "Owns the unauthorized instruction, apologizes specifically, and corrects the record with the observed error, who checked, what Leandros/Clarisse reported, and what actually moved. The apologies earn no forgiveness, trust, or authority milestone."
    - "Asks Clarisse and Leandros for factual corrections and accepts their separate boundaries. Beckendorf asks her to take two more readings the next morning; she reports observations and does not assign anyone."
    - "Tells Thalia she gave the order and was wrong. Thalia does not mediate or reassure; they share an ordinary book conversation. Ianthe still wants Zeus to notice her weather observations."
    - "Keeps her private note to Zeus unsent and undisclosed."
  clarisse:
    - "Refuses Ianthe's instruction and states she is continuing her assigned fence check. After an apology, she says she heard it but grants no forgiveness or trust."
    - "Later provides a factual timing correction only after Ianthe asks; their response remains specific to work."
  leandros:
    - "Refuses to move the coil contrary to Beckendorf's instruction. He tells Ianthe to ask rather than direct him and corrects the record about his reason."
    - "He admits he initially thought the coil shifted, then saw the mark. This practical exchange creates no friendship or broad trust."
  beckendorf:
    - "Sets the boundaries of Ianthe's task, independently checks the coil and cover, and confirms no coil movement."
    - "Reties the drying-rack cover after observed movement; the coils remain on their spacers and damp in their centers."
    - "Accepts Ianthe's corrected log and requests a second limited set of observations the following morning; he makes no broad authority grant."
  chiron:
    - "Supports the bounded task and asks Ianthe to repeat its limits; he does not grant authority over the crew or materials."
  thalia:
    - "Hears Ianthe's account of the command slip; she does not speak for Clarisse or decide whether the apology counts."
    - "Invites Ianthe to sit and talks about a book. Thalia receives no new heel examination, symptom, activity decision, or clearance; the Chapter 214 plan continues."
  annabeth:
    - "Is present during the ordinary table conversation, but does not mediate Ianthe's apology or learn any private note to Zeus."
    - "Percy and Annabeth remain secure; no erased-future memory changes."
  silena:
    - "Offers Ianthe a slice of rosemary bread; no title choice, parental relationship, or trust milestone occurs."
