status: "10,083 body words; scoped arc implementation and continuity review recorded"
relative_chronology:
  - "Begins the morning after Chapter 205's Tuesday close; no exact calendar date or year is established"
  - "An early-winter storm arrives earlier than the work schedule anticipates; the chapter continues through the next morning's ground inspection"
pov: "Clarisse La Rue, third-person limited"
locations:
  - "Big House porch and kitchen passage"
  - "Equipment yard and lower fence drainage cut"
  - "Canoe shed"
people_knowledge_relationships:
  clarisse:
    - "Follows Chiron's safety limits and leads response with Beckendorf and Eli from firm ground; does not allow anyone to climb or cross the saturated cut."
    - "Names that Ianthe's schedule left supplies in the lower shed while Leandros's separate decision moved the drainage board against instruction."
    - "Does not treat Leandros's admission or useful rope work as an apology, trust milestone, or authority."
  ianthe:
    - "Uses a schedule that leaves the dry line and repair canvas in the lower shed until after the fence inspection, relying on the expected weather window and without confirming the path with its users."
    - "Accurately identifies the direction and interval of gusts, helping Beckendorf secure the rack cover."
    - "Recognizes that the plan's order left supplies in the lower area; asks Eli about the drainage only after the damage, and writes his information without assigning him."
    - "Does not receive broad trust, authority, or a room-placement decision."
  leandros:
    - "Sees water pooling and moves the drainage board after being told to leave it until the ground is inspected. Water redirects toward the shed rack."
    - "Shows real skill with rope while moving the damp coils under Beckendorf's direction, but his boat/current experience does not establish knowledge of the camp's ground drainage."
    - "Admits he should have checked the channel from the other side. He does not apologize or seek forgiveness in this chapter."
  beckendorf:
    - "Checks the canvas brace and lower board from firm ground, directs how the rope coils are covered and moved, and postpones the drainage repair until the soil firms."
  eli:
    - "Explains from his prior leaf-clearing work that the lower run turns around the pine roots; Clarisse and later Ianthe hear this firsthand."
    - "Chooses when and how to help with sacks and supplies; he is not assigned general labor without being asked."
  chiron:
    - "Sets a no-climbing/no-crossing safety boundary, records the storm damage, and defers resetting the board until its footing can be inspected."
  percy:
    - "Helps move dry supplies and rewrite tags indoors; no leadership or interpretive role in the sibling conflict is assigned."
  annabeth:
    - "Coordinates indoor label recovery with Percy. Their familiar affection remains secure; no new relationship conflict occurs."
  thalia:
    - "Does not appear on-page; no new heel assessment, activity decision, or clearance occurs."
