people_knowledge_relationships:
  annabeth:
    - "Chooses to repair the loose Cabin One lower window keeper herself while asking Thalia to hold the lamp and materials. Thalia stays present and does not take the tool or the task."
    - "Tells Thalia she can accept help without owing the whole task; she acknowledges her own sharpness and tendency to say 'I’ll' as if that settled the work."
    - "Tells Ianthe she wants her at camp but makes no bed, room, or cabin placement promise. She admits that lists can make her sound as though she is avoiding a direct answer."
    - "Invites Ianthe to help check the storage list. Ianthe places camp-stock linens on the marked shelf and asks to sort the shelf the following day; no room assignment or broad authority is granted."
    - "Does not learn the contents of Ianthe's private note to Zeus. Thalia does not tell her."
    - "Percy offers support, waits at the room threshold when asked, and stays within Annabeth's requested boundary. They remain secure; no erased-future memory is disclosed."
  thalia:
    - "Holds the lamp, passes materials, and stays present while Annabeth completes the repair. She does not take the screwdriver or redirect the task."
    - "Acknowledges that she sometimes monitors Ianthe and intervenes for Annabeth before being asked. She plans to tell Ianthe she remains her sister even when annoyed; she has not yet said this to Ianthe."
    - "No heel examination, new symptom, activity decision, or clearance occurs. Existing care plan remains unchanged."
  ianthe:
    - "Initially reaches to redirect a younger camper's bread choice, then withdraws. She does not apologize for the initial reach."
    - "Challenges Annabeth's inventory and recognizes that the lists can feel like a way to avoid a clear answer. She also accepts that suggestions need not become instructions."
    - "Offers to help with the storage list and places marked camp-stock linens on the designated shelf. She asks to sort the shelf with Annabeth; she receives no room decision, cabin authority, or guarantee."
    - "Asks Thalia to walk with her on the condition that Thalia not direct every step; Thalia agrees to try."
    - "Does not discuss the contents of her private note to Zeus; it remains private and unsent."
  percy:
    - "Offers to hold the lamp, then waits at the doorway when Annabeth asks him to stay nearby. They share ordinary affectionate contact and remain secure."
    - "No memory boundary or family knowledge changes."
  chiron:
    - "Reads the room inventory and says the stool may remain temporarily. The full bed and room plan still requires discussion with the people who use both spaces."
    - "Expects to continue the room discussion when the morning schedule allows; no placement is decided."
  younger_camper:
    - "Keeps the piece of bread they chose after Ianthe initially tries to redirect them. No name or further relationship is established."
