    - "Still wants Zeus to visit and values his praise while remaining unsure about his account of the earlier comparison."
    - "Admits she may judge disorganized campers as stupid; no related action is taken in this chapter. Her control and status assumptions persist."
    - "Keeps her private, unsent note to Zeus undisclosed; it remains known only to Ianthe and Thalia."
  zeus:
