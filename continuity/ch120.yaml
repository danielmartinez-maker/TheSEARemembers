letter_and_knowledge:
  - "A green glass bottle with Amphitrite's shell seal reaches Percy, Clarisse, and Silena at the shore. Percy opens and reads the letter aloud; each sibling reads or hears the message. Annabeth and Thalia later read it too."
  - "Amphitrite's letter is addressed to Percy, Clarisse, and Silena, personally welcomes Clarisse and Silena, and says there is no date or hurry. It offers chosen camp friends without fixing a guest list."
  - "Clarisse says she wants to know what she is walking into and retains her right to decide how much she tells Amphitrite. Her tide-clock story is her own current-timeline account; Percy hears the fuller account from her here as new information and does not claim to remember it firsthand. Amphitrite's letter says Chiron sent Clarisse's questions but does not establish whether or how she knows about the clock incident."
  - "Percy and Clarisse and Silena do not send a reply. Percy's earlier acknowledgment draft remains with the first invitation in the Big House; Chiron confirms nothing has been sent."
  - "Percy does not disclose his erased-future memories or inability to recall his altered childhood. Amphitrite remains unaware of both."
map_and_gift:
  - "The portrait map begun in Chapter 118 is continued as a water-resistant copy. Its camp landmarks remain pictorial rather than navigational; the original stays separate, and the name/signature corner remains blank."
  - "The gift basket includes camp strawberry jam, the water-resistant map copy, Cabin One blue cloth lining, Clarisse's leather cord, and an unsigned card with no date. Silena's painted shell and cloth sleeve are kept beside the basket so the paint can finish drying; the shell is not yet packed."
  - "The card reads, 'From our camp to yours. We look forward to visiting you in Atlantis. When we're ready to come.' It remains unsigned and undated."
  - "A diagnostic lift shows the jar shifting against the map. After adding a cloth ring at the jar's base, the group carries the basket once more to check the repair; the handle stays straight and the jar no longer knocks the map. The painted shell is kept beside the basket to dry. The basket is stored on a Cabin Three shelf with the letter visible beneath its lining."
  - "The orchard apples are delivered once to the camp kitchen. Bruised fruit is marked for first use and firm fruit for breakfast; the empty wicker basket remains by the kitchen entrance."
travel_and_relationship_state:
  - "No date, route, weapons policy, transport plan, or traveler list is settled. The gift is preparation, not a departure."
  - "Clarisse writes an unsent question about palace expectations for carrying and storing weapons and who would explain them before a possible visit. She keeps the note; no answer is received and no travel choice follows."
  - "Annabeth says she still wants to visit and speaks honestly about possibly feeling like an outsider. Percy listens without promising that she will not feel that way and maintains their established, age-appropriate relationship."
  - "Thalia says she might want to go but has not checked camp coverage and is not on the traveler list. She will compare actual dates to camp needs if dates are later proposed."
  - "Clarisse remains cautious and interested; Silena is eager. Neither is recorded as having agreed to a date."
