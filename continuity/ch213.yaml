people_knowledge_relationships:
  percy:
    - "Joins Annabeth in a small paper-boat basin test; the test remains limited to the indoor basin and does not validate lake conditions or Leandros's current notes."
    - "Witnesses Leandros and Ianthe compare their different experiences of paternal attention. Ianthe reports that Zeus sometimes asked about her weather notes at home and that she valued the attention while objecting to being compared with Thalia and Annabeth."
    - "Leandros says Poseidon first marked him with a trident sign and that he wants to speak directly with Poseidon if their father visits. Leandros does not ask Percy to carry a message, and Percy makes no promise about a visit."
    - "Percy and Annabeth disagree about stepping into the sibling conflict. They decide to ask once what help is wanted, avoid carrying messages or deciding the siblings' meanings, and respond if a concrete safety need arises. They remain securely together."
    - "No erased-future memory or altered-childhood memory gap is disclosed."
  annabeth:
    - "Participates in the indoor basin test and corrects the scope when Leandros or Ianthe treats a limited observation as a broader result."
    - "Disagrees with Percy about intervening, then makes a shared, bounded plan with him. Their established relationship remains secure."
    - "Hears Ianthe's account of Zeus's attention and comparison, but Ianthe does not share the contents of her private, unsent note."
  leandros:
    - "Builds and tests paper boats in the basin. His first hull softens at a seam; a later shared hull floats under one screen push but turns and remains damp."
    - "Initially treats Ianthe's occasional attention from Zeus as evidence that she was better cared for. He hears her distinguish being noticed for weather notes from receiving the attention she wanted, and stops trying to rank their experiences."
    - "Says that Poseidon marked him with a trident sign and that he wants to speak to him directly if he visits. He does not ask Percy to carry a message."
    - "His friction and status resentment remain; the conversation does not grant authority, forgiveness, or broad trust. His conflict with Clarisse remains unresolved."
  ianthe:
    - "Reports that Zeus sometimes asked about her weather observations at home; she valued that attention but did not experience it as complete or dependable fatherly care."
    - "Tells Leandros that Zeus's later comparison of her with Thalia and Annabeth made his praise feel like a prize set against her sisters. She does not disclose her private note to Zeus."
    - "Remains bossy at points and challenges Leandros directly. She does not rank their childhoods or claim that their fathers' behavior was identical."
    - "Keeps her wind notes separate and unverified; her Big House guest-room placement and the Cabin One bed plan do not change."
