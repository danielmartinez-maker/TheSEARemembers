people_knowledge_relationships:
  percy:
    - "Acknowledges to Leandros that Atlantis gave him a home, family, and material privilege; he does not pretend those gifts erase his lack of autobiographical memories of being little there"
    - "Tells Leandros he knows he was raised there but cannot see or recall those early-childhood scenes"
    - "Rejects Leandros's unfair claim that he uses the memory gap to control conversations or collect sympathy"
    - "Wants Leandros to like him and is angry at him at the same time; he does not receive an apology or decide what their brotherhood means"
    - "Shares ordinary, secure affection with Annabeth; he does not ask her to translate Leandros or disclose the erased future"
  leandros:
    - "Shows real, bounded rope and seamanship knowledge while sorting canoe-shed lines"
    - "Orders a younger camper to move canvas rather than asking what space she needs; Percy redirects the canvas without turning the scene into a family lesson"
    - "Accepts Chiron's decision to cut a worn line down for labels after a knot test shows the fray lifting"
    - "Dismisses Percy's altered-childhood memory gap as convenient and assigns motives Percy rejects; he leaves the conflict unresolved and does not apologize"
    - "Accepts Silena's invitation to try Spoons, plays several rounds, then chooses to stop; the game does not establish trust or authority"
    - "Hears only Percy's account of his missing early Atlantis memories; he does not learn about erased-future autobiographical memories"
  annabeth:
    - "Meets Percy at the basin and makes clear she will not interpret Leandros's feelings or mediate between the brothers"
    - "Percy and Annabeth remain affectionate and secure; Annabeth does not witness the later canoe-shed disclosure"
  clarisse:
    - "Plays Spoons and later tells Percy her response to Leandros need not match his; she does not commit to welcoming or trusting him"
    - "Does not witness the private Percy–Leandros conversation at the shed"
  silena:
    - "Invites Leandros to join Spoons and lets him decide; she does not witness the private Percy–Leandros conversation"
  chiron:
    - "Supervises the practical line-sorting task and decides which material is safe for labels"
    - "Leaves before Percy and Leandros discuss Atlantis; he does not learn Percy's memory gap from this chapter"
