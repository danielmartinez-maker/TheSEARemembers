people_knowledge_relationships:
  annabeth:
    - "Helps invite the seven siblings to a seasonal meal and catches herself trying to manage their disagreements."
    - "Hears Ianthe ask Thalia about a future conversation about Zeus. Thalia sets a direct, conditional boundary; no Zeus memories or conversation details are disclosed."
    - "Shares a warm, ordinary exchange and collaborative lantern-folding with Percy; their established relationship remains secure."
    - "Does not learn Clarisse's or Silena's private title choice for Amphitrite."
  percy:
    - "Initiates the idea of a sibling meal and asks for participation rather than defining what it means."
    - "Declines to interpret Leandros's feelings or serve as a messenger to Poseidon; he says he will not decide what Leandros is proving."
    - "Shares an affectionate, secure exchange with Annabeth."
    - "No erased-future autobiographical memory is disclosed."
  clarisse:
    - "Accepts the invitation after setting a limit: she will not organize the conversation or stay for a planned dessert."
    - "Challenges Ianthe's attempt to impose serving order and objects when she wants to alter the unsigned paper instructions without checking who owns them."
    - "Asks Leandros to tell her when he wants a correction to stop; he says he wants her to ask before deciding he needs directions. This does not repair their earlier conflict or establish broad trust."
    - "Her private title choice for Amphitrite is not discussed or disclosed in the meal."
  silena:
    - "Chooses to attend and bring a rosemary flat loaf; she chooses the recipe and does not serve or manage the meal."
    - "Wraps the remaining bread and leaves when she chooses. She does not mediate anyone's conflict."
    - "Does not learn Clarisse's private title choice; her separate private title choice remains undisclosed."
  leandros:
    - "Chooses to attend and offers to carry serving bowls or a water jug. He argues with Ianthe over direction and placement and with Clarisse over unsolicited correction."
    - "Tells Annabeth he is waiting for Poseidon's possible letter and does not want others asking whether he is disappointed. No letter or date is confirmed."
    - "Is hurt when Ianthe says nobody expects him to have the answer. He accepts her specific apology as heard, without granting forgiveness or trust."
  ianthe:
    - "Offers a schedule and serving order, counts supplies, and repeatedly tries to make the meal and lantern work more orderly. She accepts some invitations to ask, but continues to prefer control."
    - "Makes a dismissive remark about Leandros's expected competence, then names the statement as wrong and apologizes. He does not forgive her or grant trust."
    - "Asks Thalia whether she might discuss Zeus later; Thalia accepts only a future direct request and shares no details here."
    - "Does not receive authority, a room decision, verification of her wider weather notes, or permission to correct the lantern diagram."
  thalia:
    - "Accepts the meal with the option to sit quietly and leave after eating."
    - "Tells Ianthe to ask her directly if she wants to discuss Zeus; she does not set a date or share a memory."
    - "Receives no new symptom report, examination, activity decision, or clearance. Chapter 214's care plan remains active."
