chapter: 214
title: "The Heel’s Measure"
source: "chapters/214-the-heels-measure.md"
status: "10,186 body words; scoped continuity review recorded"
relative_chronology:
  - "Begins more than a week after the last heel assessment in Chapter 204 and after Chapter 213's undated rainy afternoon; no exact calendar date or year is established"
  - "Continues across roughly one week through Chiron's scheduled follow-up; no exact calendar date or year is established"
pov: "Thalia, third-person limited"
locations:
  - "Cabin One"
  - "Big House office"
  - "Camp paths"
  - "Archery range"
  - "Dining hall"
people_knowledge_relationships:
  thalia:
    - "Chooses to request a properly spaced heel follow-up and chooses Annabeth as a quiet companion for the first visit; later attends the scheduled review alone."
    - "Reports that morning stiffness, downhill ache, and pain on a fast turn have eased; no pain at rest, no new fall or twist. Chiron finds further reduced swelling and lingering tenderness."
    - "Tests one arrow on dry, level ground; the heel stays quiet, and she stops after the planned single shot."
    - "On the next morning, a mild tug returns after her second arrow. She stops and returns to Chiron; no new swelling or sharp pain is found. She waits for baseline, then tries one arrow after two days and two arrows two days later without a tug."
    - "At the week's review, Chiron finds further improvement but persistent focal tenderness. He permits up to three arrows on level ground every other day, with stopping if the tug returns; no full lesson, running, patrol, hauling, or steep routes. She continues the splint on uneven paths and longer walks, with a two-week review and Will consultation if progress stalls or symptoms worsen."
    - "Tells Ianthe not to include her heel or personal route experience in the path map. She says she wants to know Ianthe without being managed or monitored."
  annabeth:
    - "Accompanies Thalia to the first visit at Thalia's request and stays quiet as asked; witnesses the exam and one-arrow attempt."
    - "Does not attend the later weekly review. Thalia reports the new plan to the family at supper; no private note to Zeus is disclosed."
    - "Respects Thalia's choice to go alone to the follow-up; their sister bond remains close."
  percy:
    - "Hears Thalia's first-visit result directly from her and asks once whether she wants to share more; does not monitor her or take over the medical decision."
    - "Hears Thalia's later report that Chiron permits a limited return to level-ground archery; no strenuous clearance is given."
    - "Remains securely with Annabeth. No erased-future or altered-childhood memory is disclosed."
  ianthe:
    - "Brings a ground-route map to Beckendorf and initially wants Thalia's heel/route detail included. Thalia refuses; Ianthe accepts the correction and removes personal medical information from the map."
    - "Tells Thalia she valued Zeus asking about her weather notes and worries that usefulness is how she earns a place. Thalia does not treat her own injury as a measure of Ianthe's belonging."
    - "Later asks about Thalia's plan and accepts the request not to check every morning. No room, bed, trust, or authority decision changes."
    - "Keeps her private unsent note to Zeus undisclosed."
  clarisse:
    - "At supper, corrects Leandros for describing an untested splice as finished. He repeats the narrower status; no trust or forgiveness milestone follows."
  leandros:
    - "Clarisse's correction about his untested splice is heard by Thalia. He accepts the narrower description but remains impatient; their conflict stays open."
  chiron:
    - "Conducts three private examinations during the chapter, records care in the medical book, and gives a staged archery plan without granting full training clearance."
    - "Will Solace remains a future consultation only if improvement stalls or symptoms worsen; he is not summoned."
  rhys:
    - "Keeps the far target available without announcing Thalia's return to the younger campers, at her request."
open_threads:
  - "Thalia's heel remains tender; next review is in two weeks, with no full return to strenuous activity."
  - "Ianthe remains in the Big House guest room; Cabin One bed placement and longer storm check of its window remain unresolved."
  - "Two coils remain damp in their centers; the repaired canvas seam is dry, but the separate splice remains untested."
  - "The lower cut and fence drainage work remain open. No divine visit, apology, or new parental promise occurs."
  - "Poseidon-sibling conflict, Ianthe's need for Zeus's attention, and the siblings' uneven trust remain unresolved."
knowledge_boundaries:
  - "Only Percy and Annabeth retain erased-future autobiographical memories."
  - "Amphitrite remains unaware of Percy's memory predicament."
  - "Ianthe's private note to Zeus remains known only to Ianthe and Thalia."
  - "Silena's private 'Mom' choice remains between Silena and Amphitrite; Thalia and Clarisse do not learn it here."
