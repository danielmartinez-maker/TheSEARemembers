people_knowledge_relationships:
  silena:
    - "Accepts several short visits with Amphitrite at her own pace. She chooses the meeting place, what to show, whether to accept help, and when to end each visit."
    - "After the accumulated contact, privately tells Amphitrite she wants to call her 'Mom' sometimes. She specifies that Maria remains her mother and asks that the title remain between them; Amphitrite agrees."
    - "Keeps the private title choice from Clarisse, Percy, Annabeth, and Leandros. She does not make a public milestone or ask anyone else to follow her choice."
    - "Keeps her letter to Maria folded and unsent; it remains separate from her relationship with Amphitrite."
    - "Shares one watercolor study with Amphitrite and keeps a second page private. Her rosemary recipe remains hers even when she shares a loaf."
    - "Refuses to carry relationship messages or explain either Leandros or Clarisse to the other."
  amphitrite:
    - "Returns to camp for separate short visits and follows Silena's stated limits. She asks before looking at Silena's page, waiting, or helping carry a basket; she accepts refusals without pressure."
    - "Hears Silena choose 'Mom' for her in private and agrees not to tell others. She does not ask for the word as a gift, reward, public announcement, or replacement for Maria."
    - "Hears that Maria remains Silena's mother and that Silena is unsure whether Maria will write back. The specifics of Silena's unsent letter remain private."
    - "Does not learn about Percy and Annabeth's erased-future memories or Percy's altered-childhood memory gap."
  clarisse:
    - "Hears Silena likes Amphitrite's company but does not learn Silena's private title choice."
    - "Says Silena need not make her own answer match Clarisse's. Clarisse chooses no maternal title and makes no new relationship commitment."
    - "Remains Silena's close sister; no forgiveness or response milestone regarding Leandros occurs."
  percy:
    - "Hears that Silena enjoys Amphitrite's company but is unsure what to call her, and that Silena's unsent letter to Maria remains important to her."
    - "Tells Silena she does not owe him the same word. He does not witness the private title choice and does not learn its contents."
    - "Shares ordinary affection and a warm family meal with Annabeth; their relationship remains secure. No erased-future memory is disclosed."
  annabeth:
    - "Tells Silena she can decide what a word means for herself. She does not witness Silena's private title choice."
    - "Shares a familiar, secure exchange with Percy; no relationship or memory boundary changes."
  leandros:
    - "Asks Silena whether she is visiting Amphitrite because of her status and whether Silena minds that Percy calls her Mom. Silena tells him her choice is hers; he accepts that he does not need to know yet."
    - "Does not learn Silena's private title choice."
    - "Eats Silena's rosemary bread after asking. He dries dishes and accepts that the recipe belongs to Silena; no forgiveness or broad trust milestone occurs."
    - "Beckendorf's controlled pull check of his rack-loop splice passes; the on-cover test remains pending. Leandros does not receive approval to return it to service."
  chiron:
    - "Passes Amphitrite's optional invitations and Silena's requests without pressure. He does not witness the private title choice."
    - "Does not set a future visit date or promise a schedule for Amphitrite."
  beckendorf:
    - "Checks the rack-loop splice under a controlled pull; it passes that check but remains pending an on-cover test before use."
