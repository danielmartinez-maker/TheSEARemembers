chapter: 217
title: "Nothing Owed to the Sea"
source: "chapters/217-nothing-owed-to-the-sea.md"
status: "10,410 body words; scoped continuity record"
relative_chronology:
  - "Follows Chapter 216; no exact calendar date or year is established"
  - "Poseidon's visit occurs first; Clarisse's private title choice follows after several days and a separate invitation"
pov: "Clarisse, third-person limited"
locations:
  - "Training square"
  - "Upper landing and marked path"
  - "Cabin Three and dining pavilion"
  - "Greenhouse path and upper-field bench"
people_knowledge_relationships:
  clarisse:
    - "Learns from Chiron that Poseidon has arrived and asked to speak with Leandros; she leaves the meeting to Leandros and does not attend."
    - "Sees Poseidon focus on Leandros's current readings and name his skill. She tells Poseidon that his attention to Leandros does not finish the history he has with her."
    - "Reminds Poseidon that he said he would ask whether she wanted him at training after the Chapter 098 visit and did not return the next morning. Poseidon acknowledges he did not come back; Clarisse declines a renewed offer to discuss training."
    - "Tells Leandros she does not resent his wanting their father. She remains angry at Poseidon and at Leandros's repeated assumption that her response is only jealousy."
    - "Hears Leandros apologize for accusing her of taking his moment out on him. She accepts that he apologized without forgiving him or granting trust."
    - "After several days and a separate walk she chooses to call Amphitrite 'Mom' sometimes in private. She says the choice does not forgive Poseidon and does not give Amphitrite authority to speak for her. Only Clarisse and Amphitrite know."
  silena:
    - "Names that Poseidon had previously made her responsible for smoothing the family gathering; she tells him she will not manage the room or serve a separate meal."
    - "Poseidon acknowledges the burden without asking her to reassure him. Silena does not mediate between Poseidon, Clarisse, or Leandros."
    - "Sees Clarisse leave for a later walk with Amphitrite and asks about it when she returns. She does not witness or learn Clarisse's private title choice."
    - "Her own private 'Mom' choice for Amphitrite and her relationship with Maria remain separate and private."
  amphitrite:
    - "Visits camp separately and asks whether Clarisse wants company. She acknowledges that relaying a question through Chiron was not the same as asking Clarisse directly."
    - "Does not speak for Clarisse to Poseidon, interpret her anger, or request a maternal title."
    - "Privately hears Clarisse choose 'Mom' sometimes and agrees to keep the choice private. She does not treat it as a repair with Poseidon or a permanent guarantee."
    - "Remains unaware of Percy's erased-future memories and altered-childhood memory gap."
  poseidon:
    - "Arrives at camp and asks to speak with Leandros. He praises Leandros's current-reading skill and asks to see his earlier notes."
    - "Acknowledges Clarisse's account of his unfulfilled Chapter 098 follow-up. He does not ask her to forgive him or promise a new training visit."
    - "Hears Silena state that she will not be made responsible for family harmony; he acknowledges his earlier request."
    - "When Leandros asks, says he will ask Chiron where to send a letter. No letter, return date, or follow-through is established."
    - "Does not learn Clarisse's private title choice or the private title Silena chose in Chapter 211."
  leandros:
    - "Shows Poseidon his current readings from the marked upper path, accepts the distinction between current skill and land safety, and admits Clarisse was right about the soft lower bank."
    - "Values Poseidon's praise and asks him to write. He remains impatient for recognition and is not given a promised visit date."
    - "Accuses Clarisse of taking her anger at Poseidon out on him, then apologizes specifically. The apology does not settle their sibling conflict."
    - "Later accepts Ianthe's correction of a gust estimate without gaining broader trust or authority."
  percy:
    - "Witnesses the visit and shares an ordinary, affectionate exchange with Annabeth. He does not act as messenger, interpreter, or mediator."
    - "Does not disclose erased-future memories or the altered-childhood memory gap."
  annabeth:
    - "Shares ordinary meal and household conversation with Percy and the siblings; her relationship with Percy remains secure."
    - "Keeps the land-route and current observations distinct when Leandros describes them; she gives no trust or authority milestone."
  chiron:
    - "Tells Leandros that Poseidon wants to speak with him and explicitly leaves the choice of meeting, refusal, or delay to Leandros."
    - "Passes Amphitrite's request for a walk to Clarisse; he does not compel either of them."
  ianthe:
    - "Later corrects Leandros's gust estimate from her own reading. He takes the reading; this does not verify her wider weather notes or grant her authority."
open_threads:
  - "Poseidon has not sent Leandros a letter or set a return date; Leandros may ask him directly."
  - "Clarisse remains angry about Poseidon's absence and the missed training follow-up. Her private title choice for Amphitrite does not change that."
  - "Clarisse's 'Mom' choice is known only to Clarisse and Amphitrite. Silena and Poseidon do not know."
  - "Silena's separate private 'Mom' choice remains known only to Silena and Amphitrite; Maria remains Silena's mother."
  - "Leandros and Clarisse remain in conflict; Leandros has made one specific apology without earning forgiveness or broad trust."
  - "Ianthe remains in the Big House guest room. The Cabin One cot and room decision remain unresolved; wider weather notes remain unverified."
  - "The two drying-rack coils remain damp in their centers; the separate rack loop still needs Beckendorf's load test."
  - "The lower-cut/fence work remains open. The marked shore route is used for observation only."
  - "Thalia remains under the Chapter 214 limited archery plan; no new symptom, examination, activity decision, or clearance occurs."
knowledge_boundaries:
  - "Only Percy and Annabeth retain erased-future autobiographical memories."
  - "Amphitrite remains unaware of Percy's memory predicament."
  - "Clarisse and Amphitrite alone know Clarisse's private title choice."
  - "Silena and Amphitrite alone know Silena's private title choice."
