directly_witnessed:
  - "Annabeth and Thalia repair and test the Zeus-cabin shelf. Annabeth finds a folded photograph wedged behind its backboard, showing Thalia, Annabeth, and toddler Jason; the reverse reads, 'The whole crew. Safe harbor, at last.'"
  - "Annabeth sees the photograph and experiences no recovered memory of the pictured day. She distinguishes what is visible, what she imagines, what Thalia reports, and what she chooses now. Her remembered Athena-cabin life remains distinct from the photograph. Thalia sees it with her; Percy is shown it at breakfast. Chiron examines only the pane's edge, while Annabeth looks down at the photograph through her open notebook; Chiron's view of the image is not established."
  - "At breakfast, Annabeth shows Percy the photograph and tells him she does not remember it being taken. They discuss her remembered Athena life and the changed childhood without disclosing either one's erased-future memories to other characters. They remain established romantic partners."
  - "Annabeth measures a loose weather-vane bracket at the Big House work table; no repair or change to the vane is shown."
  - "Annabeth and Percy make an unfinished cedar frame from scrap wood. Annabeth sets the dimensions and makes the cuts; Percy holds and sands pieces when asked. The frame remains unglued until Annabeth has consulted Thalia."
  - "At the Zeus-cabin porch, Thalia reports the photograph's story: a laundromat stop on the way to the coast, a flooded curb, waiting out rain before a bus, Annabeth playing captain with a paper boat, Thalia as lookout, and Jason trying to chew basket handles. Annabeth does not claim these as firsthand memories."
  - "Thalia says the camera belonged to Mom, attributes the back inscription to her, and says she kept the picture first because it was portable and later because she liked it. The inscription's author is attributed by Thalia, not independently verified."
  - "Thalia and Annabeth retrieve a small pane from Big House storage. Chiron examines only its edge and advises leaving the old photograph unattached, using a paper mat, keeping the pane's edge tape, and avoiding direct sunlight. Annabeth looks at the image through her open notebook; whether Chiron sees the image is not established. He receives no source story."
  - "Annabeth, Thalia, and Percy complete the cedar frame and test its fit. Annabeth accepts a small uneven corner because the joint is stable. No adhesive touches the photograph."
  - "Annabeth and Thalia move books and the helmet to make room, test the shelf, and display the old photograph beside the later Camp Jupiter visit photograph. The older picture remains on the lower shelf, angled away from glare; the shelf holds at the chapter's end."
  - "At dinner, Percy nudges the strawberry basket with water, spills a little, then wipes the table and refills the pitcher by hand. Clarisse, Silena, Thalia, and Annabeth are present; the basket is passed by hand afterward."
