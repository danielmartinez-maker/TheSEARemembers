people_knowledge_relationships:
  leandros:
    - "Asks to contribute his practical water-current observations to a winter equipment move. His skill remains narrow: he can distinguish surface wind from a lower current at a specific landing and time."
    - "Stays on the dry landing and records conditions, locations, and times. He does not launch a canoe or infer that the bank or footpath is safe from the water reading."
    - "Asks before adding notes to Annabeth's working map. He helps separate water observations from ground-route checks and accepts that the main map and work sheet are collaborative."
    - "Initially reacts defensively to Clarisse's corrections and claims that his route is better before checking all users and ground conditions. He later distinguishes what he knows from what needs checking, though status resentment persists."
    - "Helps carry a narrow canvas bundle along the marked route. The wide roll remains untested at the bathhouse alternative and needs a separate plan."
    - "Does not learn Silena's private title choice from Chapter 211. No forgiveness, broad trust, or permanent authority is granted."
  clarisse:
    - "Sets clear limits for Leandros's check: dry landing only, no launching, no moving the drainage board, and no use of the low cut."
    - "Corrects Leandros when he treats water observations as proof of ground access. She recognizes that his observations are useful without approving the entire route or granting authority."
    - "Works with Leandros on the carry test. Their sibling relationship remains strained; no forgiveness milestone occurs."
  annabeth:
    - "Allows Leandros to add time- and location-specific current notes to a working tracing sheet, while keeping water observations separate from foot-route checks."
    - "Clarifies that the camp map needs to work for people who have not seen the route. She preserves the distinction between observed, tested, and untested information."
    - "Shares familiar, secure affection with Percy; no memory boundary changes."
  percy:
    - "Discusses correction and uncertainty directly with Leandros without mediating his relationship with Clarisse."
    - "Remains securely with Annabeth. No erased-future memory or private family information is disclosed."
  beckendorf:
    - "Sets the carry task and joins checks of the ground and equipment route. He asks for source and condition labels, and keeps the wide roll out of service until its route and turn are tested."
    - "Identifies the shallow puddle near the basin as water from a cracked jug, not hillside runoff. He says he will mark it for Chiron; the jug remains in place."
    - "Does not inspect the drying-rack loop on the cover in this chapter; its on-cover test remains pending."
  chiron:
    - "Requires Leandros to separate water observations from ground checks before any route is used."
    - "No new repair authorization, injury guidance, or relationship decision occurs."
  silena:
    - "Shares the rosemary loaf at dinner. The recipe remains hers; no new relationship or title information is disclosed."
  bathhouse_crew:
    - "Allows a walk-through of the alternative path while supplies dry, but does not give standing permission to carry through or move their belongings."
