  - "The work sheet distinguishes a location-specific observation, a tested narrow-roll route, and untested alternatives."
  - "Only Percy and Annabeth retain autobiographical memories of the erased future; no disclosure occurs."
  - "Leandros does not learn Silena's private 'Mom' title choice; it remains between Silena and Amphitrite."
  - "No new room assignment, wind-note approval, or authority is granted to Ianthe."
