directly_witnessed:
  - "Percy reads a damp letter from Triton about palace repairs and a mischievous hippocamp. The spear interruption leaves him with part of the letter unread until later in the chapter. Percy writes a question in its margin, refolds it, and stores it; the letter is not sent."
  - "Clarisse's practice spear strikes the driftwood beam above Percy's worktable after her thrown line is cluttered by a practice rope left across the path. No one is injured. The beam is punctured and splintered."
  - "The siblings discuss chores, shared training access, equipment care, guest boundaries, and quiet time. They draft and mount a Cabin Three rules board with a chores rota, training sign-up, patch map, visitor terms, and quiet-hour agreement. During a later footwork check, a stone boundary marker rolls toward the path and the target obscures a flag from the cabin approach; the group relocates the marker, checks both sightlines, and records that check on the map."
  - "Percy, Clarisse, and Silena remove the rope from the path, reposition and mark its storage/working route, find a discarded wrist guard, and restore equipment to its marked place. Clarisse accepts responsibility for leaving the setup out and for the unsafe throw; Percy and Clarisse report the near miss to Chiron."
  - "Chiron inspects the beam and finds no structural split. He requires a hardwood plug after the wood dries, and keeps throwing suspended until he separately inspects the target, net, and backstop. These repairs/checks are pending at chapter end."
  - "The worktable is moved to the wall opposite the window; chairs are placed to keep the door route clear. The laundry basket gets a marked place beneath the side table."
  - "Clarisse may do footwork but no throws until Chiron's checks are complete. The siblings revise the map after finding their first drill boundary wrong for the moved post. Percy and Clarisse complete one agreed chore swap; Percy sweeps the patch and Clarisse the entry."
  - "Tyson visits with oranges and sponges. The cabin rules apply to the three residents; Tyson is welcome, is not assigned chores, and may choose to help without needing to earn the visit."
  - "A daily 2–3 p.m. quiet hour is agreed, shiftable for the day only by mutual agreement. A blue cloth on the hook signals that it is active; emergency entry is allowed. The formal hour has not yet been tried. Percy separately asks to finish reading his letter, and his siblings respect the request."
